<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - VIBE FASHION</title>
    <!-- Bootstrap 5.3 CDN CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 2.5rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="bg-primary text-white d-inline-flex align-items-center justify-content-center rounded-3 p-3 mb-3 shadow">
                <i class="bi bi-shield-lock-fill fs-3"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">VIBE FASHION</h4>
            <p class="text-secondary small mb-0">통합 관리자 인증 시스템</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} small py-2 px-3 rounded-3 mb-3" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin.admin_login', next=request.args.get('next', '')) }}">
            <div class="mb-3">
                <label for="adminEmail" class="form-label small fw-bold text-secondary">관리자 이메일</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="adminEmail" name="email" placeholder="admin@vibefashion.com" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="adminPassword" class="form-label small fw-bold text-secondary">비밀번호</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control" id="adminPassword" name="password" placeholder="비밀번호 입력" required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold fs-6 py-2.5 shadow-sm">
                    관리자 로그인
                </button>
            </div>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <a href="{{ url_for('main.index') }}" class="text-decoration-none small text-muted">
                <i class="bi bi-arrow-left me-1"></i>쇼핑몰 홈으로 돌아가기
            </a>
        </div>
    </div>
</body>
</html>
